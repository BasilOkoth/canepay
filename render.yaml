services:
  - type: web
    name: miwa360
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: SEED_DEMO
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: miwa360-db
          property: connectionString

databases:
  - name: miwa360-db
    databaseName: miwa360
    user: miwa360
